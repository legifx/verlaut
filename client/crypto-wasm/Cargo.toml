[package]
name = "verlaut-crypto-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Thin wasm-bindgen wrapper over libsignal for the Verlaut browser client. NO own crypto."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# libsignal (offizielle Rust-Implementierung). Wir kompilieren NUR, wir
# reimplementieren nichts. Pinned auf ein Release-Tag.
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.94.3" }
rand = "0.9"   # muss zu libsignals rand_core (0.9) passen
# Im Baum liegen ZWEI getrandom-Majors (0.3 via libsignal, 0.2 via rand/
# curve25519). Beide brauchen auf wasm ihr JS-Backend — hier renamed
# eingebunden, nur um die Features zu aktivieren (Web Crypto getRandomValues).
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
js-sys = "0.3"
# Ready-Futures der InMem-Stores synchron auspollen (kein async am JS-Rand).
futures-util = { version = "0.3", default-features = false }
base64 = "0.22"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
opt-level = "s"
lto = true
